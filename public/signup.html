<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SkillSync - Sign Up</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card">
    <h1>Create Account</h1>

    <form id="signupForm">
      <label>Full Name</label>
      <input type="text" id="name" required>

      <label>Department</label>
      <input type="text" id="dept">

      <label>Email</label>
      <input type="email" id="email" required>

      <label>Username</label>
      <input type="text" id="username" required>

      <label>Password</label>
      <input type="password" id="password" required>

      <button type="submit">Sign Up</button>
    </form>

    <p class="switch">Already have an account? <a href="index.html">Login</a></p>
    <p id="message" class="message"></p>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById('name').value,
        dept: document.getElementById('dept').value,
        email: document.getElementById('email').value,
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      };
      try {
        await api('/auth/signup', 'POST', payload);
        document.getElementById('message').innerText = 'Registered! You can log in now.';
        setTimeout(() => window.location.href = 'index.html', 1000);
      } catch (err) {
        document.getElementById('message').innerText = err.message;
      }
    });
  </script>
</body>
</html>
