<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SkillSync - My Profile</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <span class="logo">SkillSync</span>
    <a href="profile.html">My Profile</a>
    <a href="dashboard.html">Team Dashboard</a>
    <a href="#" id="logout">Logout</a>
  </nav>

  <div class="card">
    <h1>My Skill Profile</h1>

    <form id="profileForm">
      <label>Programming Skill (1-5)</label>
      <input type="number" min="1" max="5" id="programmingSkill" required>

      <label>Database Skill (1-5)</label>
      <input type="number" min="1" max="5" id="databaseSkill" required>

      <label>UI/UX Skill (1-5)</label>
      <input type="number" min="1" max="5" id="uiuxSkill" required>

      <label>Presentation Skill (1-5)</label>
      <input type="number" min="1" max="5" id="presentationSkill" required>

      <label>Preferred Role</label>
      <input type="text" id="preferredRole" placeholder="e.g. Backend Developer">

      <label>Interest</label>
      <input type="text" id="interest" placeholder="e.g. Web Application">

      <button type="submit">Save Profile</button>
    </form>

    <hr>

    <h2>Request a Team</h2>
    <form id="teamForm">
      <label>Team Size</label>
      <input type="number" min="2" id="teamSize" required>

      <label>Software Category</label>
      <select id="category">
        <option>Web Application</option>
        <option>Mobile Application</option>
        <option>AI/ML Application</option>
        <option>Game Development</option>
        <option>Data Analytics Application</option>
        <option>Cloud-Based Application</option>
        <option>Cybersecurity Tool</option>
      </select>

      <button type="submit">Form Team</button>
    </form>

    <p id="message" class="message"></p>
  </div>

  <script src="js/app.js"></script>
  <script>
    const sid = localStorage.getItem('sid');
    if (!sid) window.location.href = 'index.html';

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        programmingSkill: +document.getElementById('programmingSkill').value,
        databaseSkill: +document.getElementById('databaseSkill').value,
        uiuxSkill: +document.getElementById('uiuxSkill').value,
        presentationSkill: +document.getElementById('presentationSkill').value,
        preferredRole: document.getElementById('preferredRole').value,
        interest: document.getElementById('interest').value,
      };
      try {
        await api(`/students/${sid}`, 'PUT', payload);
        document.getElementById('message').innerText = 'Profile saved.';
      } catch (err) {
        document.getElementById('message').innerText = err.message;
      }
    });

    document.getElementById('teamForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        teamSize: +document.getElementById('teamSize').value,
        category: document.getElementById('category').value,
        createdBy: sid,
      };
      try {
        const data = await api('/teams/form', 'POST', payload);
        localStorage.setItem('teamId', data.teamId);
        window.location.href = 'dashboard.html';
      } catch (err) {
        document.getElementById('message').innerText = err.message;
      }
    });

    document.getElementById('logout').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
